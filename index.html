<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Natyv AI" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--
      Per-page <title>, <meta name="description">, canonical, OpenGraph, and JSON-LD
      are injected by vite-react-ssg's <Head> component (powered by react-helmet-async).
      See src/pages/{Index,About,Advisory}.tsx for per-route overrides.
      Twitter Card defaults below — overridden per-route where needed.
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@NatyvAI" />
    <meta name="twitter:image" content="https://natyv.ai/og-image.png" />

    <!-- Fonts: Playfair Display (headlines) + Inter (body) + Poppins (accent) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- JSON-LD: Organization, WebSite, Person, ProfessionalService -->

        "https://www.facebook.com/natyv_ai",

        "@type": "Organization",
        "name": "MyAgent",
        "url": "https://get-myagent.com/",
        "description": "Productized SaaS platform for AI voice agents and operational workflows."

    {

        "Voice AI",
        "AI Agents",

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
