<!doctype html>
<html lang="en" class="dark">

    <meta name="author" content="Natyv AI" />

    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />

    <!--
      Per-page <title>, <meta name="description">, canonical, OpenGraph, and JSON-LD
      are injected by vite-react-ssg's <Head> component (powered by react-helmet-async).
      See src/pages/{Index,About,Advisory}.tsx for per-route overrides.
      Twitter Card defaults below — overridden per-route where needed.
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@NatyvAI" />
    <meta name="twitter:image" content="https://natyv.ai/og-image.png" />

    <!-- Fonts: Playfair Display (headlines) + Inter (body) + Poppins (accent) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      MyAgent Agent Layer — the same one-line install we sell to clients, so
      natyv.ai runs the product rather than only describing it.

      Adds two things and removes nothing: WebMCP tools for AI agents (via
      document.modelContext — renders no markup at all) and the trained Ava
      concierge widget for human visitors (one floating button). Both are
      driven by the manifest at get-myagent.com/agent-layer/natyv-ai.json,
      so tools and copy change without touching this site again.

      Silently no-ops in browsers without WebMCP; the widget still loads.
      See my-agent-ai/docs/superpowers/specs/2026-08-27-agent-layer-design.md
    -->
    <!--
      ?v= is load-bearing. Cloudflare pins .js to a 4-hour browser cache at
      the zone level, overriding the 300s in my-agent-ai/public/_headers
      (the .json manifest does honour 300s). Without a version bump, a fix
      to the bundle takes up to 4 hours to reach anyone who already visited.
      Bump v when the bundle changes; manifest-only changes need no bump.
    -->
    <script src="https://get-myagent.com/agent-layer/agent-layer.js?v=2"
            data-slug="natyv-ai" async></script>
  </body>
